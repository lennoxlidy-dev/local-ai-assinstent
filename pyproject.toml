[project]
name = "assistant"
version = "0.1.1"
description = "Local, voice-controlled AI assistant for Windows (tray app)."
requires-python = ">=3.12"
license = { text = "Proprietary - personal use" }
dependencies = [
    # UI: Essentials = QtCore/Gui/Widgets/Qml/Quick only (no WebEngine/Multimedia bloat).
    "PySide6-Essentials>=6.10",
    "tomli-w>=1.0",
    "psutil>=6.0",
    "rapidfuzz>=3.9",          # fuzzy matching (apps, windows, facts)
    "send2trash>=1.8",         # Recycle Bin (never permanent delete)
    "pypdfium2>=4.30",         # fast PDF text extraction
    # --- voice: CPU only, ONNX Runtime inside sherpa-onnx (no PyTorch) ---
    "sherpa-onnx>=2.0.1",      # wake word, VAD, speech recognition, speech output, speaker check
    "sentencepiece>=0.2",      # any wake-word name -> model tokens (no training)
    "numpy>=2.0",
    "sounddevice>=0.5",        # microphone + speaker (PortAudio; bundled in the Windows wheel)
    "soxr>=0.5",               # high-quality resampling
    # --- Windows integration ---
    "pywin32>=308; sys_platform == 'win32'",
    "comtypes>=1.4; sys_platform == 'win32'",
    "pyvda>=0.6; sys_platform == 'win32'",            # virtual desktops (undocumented APIs)
    "pycaw>=20240316; sys_platform == 'win32'",       # volume (Core Audio)
    "uiautomation>=2.0.20; sys_platform == 'win32'",  # UI Automation
    "mss>=9.0; sys_platform == 'win32'",              # screenshots
    "winrt-runtime>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.0; sys_platform == 'win32'",
    "winrt-Windows.Media.Control>=3.0; sys_platform == 'win32'",   # media sessions (SMTC)
    "winrt-Windows.Media.Ocr>=3.0; sys_platform == 'win32'",       # OCR
]

[project.scripts]
# Console launcher (text-mode debug CLI and diagnostics).
assistant-cli = "assistant.__main__:cli_entry"

[project.gui-scripts]
# Windowless launcher for the tray app (no console window).
assistant = "assistant.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.11"]     # scripts\build-exe.ps1 (the standalone .exe folder)

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
# SIM112: Windows env var names are case-insensitive. SIM115: long-lived handles (crash log).
ignore = ["E501", "UP007", "SIM105", "SIM108", "SIM112", "SIM115", "B008"]
