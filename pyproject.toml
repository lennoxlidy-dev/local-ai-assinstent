[project]
name = "assistant"
version = "0.1.0"
description = "Local, voice-controlled AI assistant for Windows (tray app)."
requires-python = ">=3.12"
license = { text = "Proprietary - personal use" }
dependencies = [
    # UI: Essentials = QtCore/Gui/Widgets/Qml/Quick only (no WebEngine/Multimedia bloat).
    "PySide6-Essentials>=6.10",
    "tomli-w>=1.0",
    "psutil>=6.0",
]

[project.scripts]
# Console launcher (text-mode debug CLI and diagnostics).
assistant-cli = "assistant.__main__:cli_entry"

[project.gui-scripts]
# Windowless launcher for the tray app (no console window).
assistant = "assistant.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
# SIM112: Windows env var names are case-insensitive. SIM115: long-lived handles (crash log).
ignore = ["E501", "UP007", "SIM105", "SIM108", "SIM112", "SIM115", "B008"]
